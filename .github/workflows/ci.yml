name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Rodar lint
        run: npm run lint

      - name: Checar formatação (Prettier)
        run: npm run format:check

      - name: Checar tipos (TypeScript)
        run: npm run typecheck

      - name: Rodar testes
        run: npm run test

      - name: Build de produção
        run: npm run build
        env:
          # Valores só para o build do CI (sem uso real)
          BETTER_AUTH_SECRET: ci-build-secret-sem-uso-real-0123456789
          BETTER_AUTH_URL: http://localhost:3000

  e2e:
    runs-on: ubuntu-latest

    # Mesmo banco e Mailpit do docker-compose.yml
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: uniteto
          POSTGRES_PASSWORD: uniteto
          POSTGRES_DB: uniteto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uniteto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DATABASE_URL: postgresql://uniteto:uniteto@localhost:5432/uniteto?schema=public
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      # Valores só para os testes do CI (sem uso real)
      BETTER_AUTH_SECRET: ci-e2e-secret-sem-uso-real-0123456789
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Aplicar migrations e seed
        run: |
          npm run db:deploy
          npm run db:seed

      - name: Rodar testes E2E
        run: npm run test:e2e

      - name: Guardar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
